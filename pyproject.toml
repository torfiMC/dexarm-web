[project]
name = "dexarm-web"
version = "0.1.0"
description = "Web control panel for the Rotrics DexArm: 3D view, jogging, live tracking, queue, graphs and bookmarks"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
dexarm-web = "dexarm_web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dexarm_web"]
